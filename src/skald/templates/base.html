<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skald{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/search">
        <span class="brand-mark">SK</span>
        <span>SKALD</span>
      </a>
      {% if request.url.path != "/login" %}
      <nav class="main-nav">
        <a href="/search" class="{% if request.url.path.startswith('/search') %}active{% endif %}">Search</a>
        <a href="/jobs" class="{% if request.url.path.startswith('/jobs') %}active{% endif %}">Jobs</a>
      </nav>
      {% endif %}
      <div class="topbar-spacer"></div>
      {% if request.url.path != "/login" %}
      <a href="/logout" class="logout-link">Log out</a>
      {% endif %}
    </div>
  </header>
  <div class="shell">
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
